name: Climat

on:
  schedule:
    # Créneau voulu : minuit à Paris. Déclenchements multiples en secours (retards ou oublis de GitHub) :
    # scripts/lib/guard.mjs n'exécute la tâche qu'une fois par créneau.
    - cron: "20 0-5,22,23 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Forcer l'exécution hors créneau"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: data-climat
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Actualiser les données du climat
        run: node scripts/climat.mjs
        env:
          FORCE: ${{ inputs.force && '1' || '' }}
      - name: Publier si les données ont changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "Rien à publier."
            exit 0
          fi
          git commit -m "Climat : mise à jour des données"
          for essai in 1 2 3 4 5; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((essai * 7))
          done
          echo "Envoi impossible après cinq essais." >&2
          exit 1
