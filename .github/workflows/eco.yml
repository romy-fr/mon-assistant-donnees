name: Économie

on:
  schedule:
    # Lundi 7 h 05 à Paris : 5 h 05 UTC en été, 6 h 05 UTC en hiver. La garde horaire du script
    # ne laisse passer que l'heure de Paris voulue (7 h ou 8 h, pour absorber un retard de GitHub).
    - cron: "5 5 * * 1"
    - cron: "5 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-push
  cancel-in-progress: false

jobs:
  eco:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Récupérer les séries officielles
        run: node scripts/eco.mjs
      - name: Enregistrer si les données ont changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/eco.json
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "data: économie $(date -u +%F)"
            git pull --rebase
            git push
          fi
