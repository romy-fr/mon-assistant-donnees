name: Économie

on:
  schedule:
    # Créneau voulu : lundi 7 h à Paris. Déclenchements multiples en secours (retards ou oublis de GitHub) :
    # scripts/lib/guard.mjs n'exécute la tâche qu'une fois par créneau.
    - cron: "35 5-12 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-eco
  cancel-in-progress: false

jobs:
  eco:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Récupérer les séries officielles
        run: node scripts/eco.mjs
      - name: Enregistrer si les données ont changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/eco.json data/_meta/slots/eco.json
          if git diff --cached --quiet; then
            echo "Aucun changement."
            exit 0
          fi
          git commit -m "data: économie $(date -u +%F)"
          for essai in 1 2 3 4 5; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((essai * 7))
          done
          echo "Envoi impossible après cinq essais." >&2
          exit 1
