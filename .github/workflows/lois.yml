name: Lois

# Textes en discussion et votes (Assemblée nationale, Sénat).
# Rythme voulu (heure de Paris) : 8 h, 14 h et 20 h chaque jour, et seulement 14 h le week-end.
# GitHub compte en UTC : on programme les deux heures UTC possibles (hiver et été, à la minute 5),
# et scripts/lois.mjs ne laisse passer que celle qui correspond à l'heure de Paris voulue.
on:
  schedule:
    # Créneau voulu : 8 h, 14 h et 20 h à Paris (14 h seulement le week-end). Déclenchements multiples en secours (retards ou oublis de GitHub) :
    # scripts/lib/guard.mjs n'exécute la tâche qu'une fois par créneau.
    - cron: "5 6-22 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Forcer l'actualisation (ignore l'heure et la date des sources)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data-lois
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Actualiser les lois
        env:
          FORCE: ${{ inputs.force && '1' || '' }}
        run: node scripts/lois.mjs
      - name: Enregistrer les changements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Aucun changement."
            exit 0
          fi
          git commit -m "Lois : actualisation des données"
          for essai in 1 2 3 4 5; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((essai * 7))
          done
          echo "Envoi impossible après cinq essais." >&2
          exit 1
